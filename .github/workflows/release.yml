name: Build, Release & Attest

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  id-token: write
  contents: write
  attestations: write

jobs:
  release-contract:
    uses: stellar-expert/soroban-build-workflow/.github/workflows/release.yml@main
    with:
      release_name: ${{ github.ref_name }}
      release_description: "verify-build-demo contract release"
      package: 'verify-build-demo'
    secrets:
      release_token: ${{ secrets.GITHUB_TOKEN }}